<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Manager</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    input, button { padding: 8px; margin: 4px 0; }
    input { width: 100%; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
    button { cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 6px; }
    button.danger { background: #dc2626; }
    .row { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <h1>📇 Contact Manager</h1>

  <h3>Add / Update Contact</h3>
  <input id="name" placeholder="Name">
  <input id="phone" placeholder="Phone">
  <input id="email" placeholder="Email">
  <button onclick="saveContact()">Save</button>

  <h3>Contacts</h3>
  <input id="search" placeholder="🔍 Search..." oninput="render()">
  <table>
    <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    let contacts = [];
    let editId = null;

    async function load() {
      contacts = await (await fetch("/api/contacts")).json();
      render();
    }

    function render() {
      const q = document.getElementById("search").value.toLowerCase();
      const rows = contacts
        .filter(c => c.user_name.toLowerCase().includes(q))
        .map(c => `<tr>
          <td>${c.user_name}</td>
          <td>${c.phone}</td>
          <td>${c.email}</td>
          <td>
            <button onclick="edit(${c.id_user})">✏️</button>
            <button class="danger" onclick="del(${c.id_user})">🗑️</button>
          </td>
        </tr>`).join("");
      document.getElementById("tbody").innerHTML = rows;
    }

    async function saveContact() {
      const body = {
        user_name: name.value,
        phone: phone.value,
        email: email.value
      };
      if (editId) {
        await fetch(`/api/contacts/${editId}`, {
          method: "PUT", headers: {"Content-Type":"application/json"},
          body: JSON.stringify(body)
        });
        editId = null;
      } else {
        await fetch("/api/contacts", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify(body)
        });
      }
      name.value = phone.value = email.value = "";
      load();
    }

    function edit(id) {
      const c = contacts.find(x => x.id_user === id);
      name.value = c.user_name; phone.value = c.phone; email.value = c.email;
      editId = id;
    }

    async function del(id) {
      if (!confirm("Delete?")) return;
      await fetch(`/api/contacts/${id}`, { method: "DELETE" });
      load();
    }

    load();
  </script>
</body>
</html>
